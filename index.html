<html>
    <head>
        <title>SLO Simulator</title>

        <!-- Load plotly.js into the DOM -->
        <script src="https://cdn.plot.ly/plotly-3.6.0.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
        <script src="perlin.js"></script>
        <script src="timeseries.js"></script>
    </head>

    <body>
        <!-- Graph of events -->
        <h1>Settings</h1>
        <h2>SLO & Alert</h2>
        SLO Target %:
        <input type="text" name="slo_target_percent" value="99.9" /><br />
        Long Window (seconds):
        <input type="text" name="long_window_seconds" value="10800" /><br />
        Short Window (seconds):
        <input type="text" name="short_window_seconds" value="900" /><br />
        Burn rate threshold:
        <input type="text" name="burn_rate_threshold" value="2" /><br />

        <h2>Error Generation</h2>
        Max Error Percentage:
        <input type="text" name="max_error_percent" value="10" /><br />

        <h1>Events</h1>
        <div id="events" style="height: 500px"></div>

        <h1>Cumulative rate</h1>
        <div id="cumulative" style="height: 500px"></div>

        <h1>Burn</h1>
        <div id="budget" style="height: 500px"></div>

        <script>
            const TOTAL_SECONDS = 24 * 60 * 60;
            const SAMPLE_RATE_SECONDS = 60;

            class AlertView {
                constructor(totalSeconds, sampleRateSeconds) {
                    this.totalSeconds = totalSeconds;
                    this.sampleRateSeconds = sampleRateSeconds;
                }

                render(
                    sloTargetFraction,
                    longWindowSeconds,
                    shortWindowSeconds,
                    maxErrorRate,
                    burnRateThreshold,
                ) {
                    const errorBudgetFraction = 1 - sloTargetFraction;

                    var timeline = [];
                    var t = new Date();
                    t.setHours(0, 0, 0, 0);

                    var cumulative = new SLIWindow(
                        this.totalSeconds / this.sampleRateSeconds,
                    );
                    var longWindow = new SLIWindow(
                        longWindowSeconds / this.sampleRateSeconds,
                    );
                    var shortWindow = new SLIWindow(
                        shortWindowSeconds / this.sampleRateSeconds,
                    );

                    const perlin = new Perlin(3);

                    for (
                        var i = 0;
                        i < this.totalSeconds;
                        i += this.sampleRateSeconds
                    ) {
                        t.setSeconds(t.getSeconds() + this.sampleRateSeconds);
                        // TODO: Add noise and a daily cycle
                        const amplitude = 100000;
                        var good = amplitude;

                        var errorRate = perlin.getValue(
                            (256 / 2) * (i / this.totalSeconds),
                        );

                        // Errors can only be above 0
                        if (errorRate < 0) {
                            errorRate = 0;
                        }
                        // Limit error duration
                        if (
                            i < this.totalSeconds / 4 ||
                            i > this.totalSeconds / 4 + 3 * 60 * 60
                        ) {
                            errorRate = 0;
                        }
                        // Scale maximum error percentage
                        errorRate *= maxErrorRate;

                        cumulative.push(good, good * errorRate);
                        longWindow.push(good, good * errorRate);
                        shortWindow.push(good, good * errorRate);

                        timeline.push({
                            time: t.toISOString(),
                            good: good,
                            bad: good * errorRate,
                            cumulative: cumulative.clone(),
                            longWindow: longWindow.clone(),
                            shortWindow: shortWindow.clone(),
                        });
                    }

                    var dataGraph = new Timeseries(
                        this.totalSeconds,
                        this.sampleRateSeconds,
                        {
                            type: "scatter",
                        },
                    );
                    dataGraph.addTrace((i) => timeline[i].good, {
                        name: "good",
                    });
                    dataGraph.addTrace((i) => timeline[i].bad, { name: "bad" });

                    t.setSeconds(t.getSeconds() - 50000);
                    var t2 = new Date(t.getTime());
                    t2.setSeconds(t2.getSeconds() + 5000);

                    dataGraph.addAlert((i) => {
                        const l =
                            timeline[i].longWindow.errorRate() /
                            errorBudgetFraction;
                        const s =
                            timeline[i].shortWindow.errorRate() /
                            errorBudgetFraction;
                        return l > burnRateThreshold && s > burnRateThreshold;
                    });
                    dataGraph.render("events");

                    var cumulativeGraph = new Timeseries(
                        this.totalSeconds,
                        this.sampleRateSeconds,
                        {
                            type: "scatter",
                        },
                    );
                    cumulativeGraph.addTrace(
                        (i) => 1 - timeline[i].cumulative.errorRate(),
                        { name: "cumulative" },
                    );
                    cumulativeGraph.addTrace(
                        (i) => 1 - timeline[i].longWindow.errorRate(),
                        { name: "long window" },
                    );
                    cumulativeGraph.addTrace(
                        (i) => 1 - timeline[i].shortWindow.errorRate(),
                        { name: "short window" },
                    );
                    cumulativeGraph.addAlert((i) => {
                        const l =
                            timeline[i].longWindow.errorRate() /
                            errorBudgetFraction;
                        const s =
                            timeline[i].shortWindow.errorRate() /
                            errorBudgetFraction;
                        return l > 2 && s > 2;
                    });
                    cumulativeGraph.render("cumulative");

                    var burnGraph = new Timeseries(
                        this.totalSeconds,
                        this.sampleRateSeconds,
                        {
                            type: "scatter",
                        },
                    );
                    burnGraph.addTrace(
                        (i) =>
                            timeline[i].cumulative.errorRate() /
                            errorBudgetFraction,
                        { name: "cumulative" },
                    );
                    burnGraph.addTrace(
                        (i) =>
                            timeline[i].longWindow.errorRate() /
                            errorBudgetFraction,
                        { name: "long window" },
                    );
                    burnGraph.addTrace(
                        (i) =>
                            timeline[i].shortWindow.errorRate() /
                            errorBudgetFraction,
                        { name: "short window" },
                    );
                    burnGraph.addAlert((i) => {
                        const l =
                            timeline[i].longWindow.errorRate() /
                            errorBudgetFraction;
                        const s =
                            timeline[i].shortWindow.errorRate() /
                            errorBudgetFraction;
                        return l > 2 && s > 2;
                    });

                    burnGraph.addThreshold(burnRateThreshold);

                    burnGraph.render("budget");
                }
            }

            ac = new AlertView(TOTAL_SECONDS, SAMPLE_RATE_SECONDS);

            const inputSloTargetPercent = document.querySelector(
                'input[name="slo_target_percent"]',
            );
            const inputLongWindowSeconds = document.querySelector(
                'input[name="long_window_seconds"]',
            );
            const inputShortWindowSeconds = document.querySelector(
                'input[name="short_window_seconds"]',
            );
            const inputMaxErrorPercent = document.querySelector(
                'input[name="max_error_percent"]',
            );
            const inputBurnRateThreshold = document.querySelector(
                'input[name="burn_rate_threshold"]',
            );

            doRender = function () {
                ac.render(
                    inputSloTargetPercent.value / 100,
                    inputLongWindowSeconds.value,
                    inputShortWindowSeconds.value,
                    inputMaxErrorPercent.value / 100,
                    inputBurnRateThreshold.value,
                );
            };

            inputSloTargetPercent.addEventListener("change", doRender);
            inputLongWindowSeconds.addEventListener("change", doRender);
            inputShortWindowSeconds.addEventListener("change", doRender);
            inputMaxErrorPercent.addEventListener("change", doRender);
            inputBurnRateThreshold.addEventListener("change", doRender);

            doRender();
        </script>
    </body>
</html>
