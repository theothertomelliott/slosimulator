<html>
    <head>
        <title>SLO Simulator</title>

        <script src="./dist/main.js"></script>
    </head>

    <body>
        <!-- Graph of events -->
        <h1>Settings</h1>
        <h2>SLO & Alert</h2>
        SLO Target %:
        <input type="text" name="slo_target_percent" value="99.9" /><br />
        Long Window (seconds):
        <input type="text" name="long_window_seconds" value="10800" /><br />
        Short Window (seconds):
        <input type="text" name="short_window_seconds" value="900" /><br />
        Burn rate threshold:
        <input type="text" name="burn_rate_threshold" value="2" /><br />

        <h2>Error Generation</h2>
        Max Error Percentage:
        <input type="text" name="max_error_percent" value="10" /><br />

        <h1>Events</h1>
        <div id="events" style="height: 500px"></div>

        <h1>Burn</h1>
        <div id="budget" style="height: 500px"></div>

        <script>
            const TOTAL_SECONDS = 24 * 60 * 60;
            const SAMPLE_RATE_SECONDS = 60;

            acEvents = new AlertView("events", TOTAL_SECONDS, SAMPLE_RATE_SECONDS);
            acCumulative = new AlertView("cumulative", TOTAL_SECONDS, SAMPLE_RATE_SECONDS);
            acBudget = new AlertView("budget", TOTAL_SECONDS, SAMPLE_RATE_SECONDS);

            acEvents.render({
              slo: {
                targetPercent: document.querySelector('input[name="slo_target_percent"]'),
                longWindowSeconds: document.querySelector('input[name="long_window_seconds"]'),
                shortWindowSeconds: document.querySelector('input[name="short_window_seconds"]'),
                burnRateThreshold: document.querySelector('input[name="burn_rate_threshold"]'),
              },
              data: {
                good: {},
                bad: {
                  maxErrorPercent: document.querySelector('input[name="max_error_percent"]'),
                },
              },
              traces: {
                good: true,
                bad: true,
              }
            });

            acBudget.render({
              slo: {
                targetPercent: document.querySelector('input[name="slo_target_percent"]'),
                longWindowSeconds: document.querySelector('input[name="long_window_seconds"]'),
                shortWindowSeconds: document.querySelector('input[name="short_window_seconds"]'),
                burnRateThreshold: document.querySelector('input[name="burn_rate_threshold"]'),
              },
              data: {
                good: {},
                bad: {
                  maxErrorPercent: document.querySelector('input[name="max_error_percent"]'),
                },
              },
              traces: {
                burnLong: true,
                burnShort: true,
              }
            });
        </script>
    </body>
</html>
