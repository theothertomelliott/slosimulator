<html>
    <head>
        <!-- Load plotly.js into the DOM -->
        <script src="https://cdn.plot.ly/plotly-3.6.0.min.js"></script>
    </head>

    <body>
        <!-- Graph of events -->
        <h1>Events</h1>
        <div id="events" style="height: 500px"></div>
        <h1>Cumulative rate</h1>
        <div id="cumulative" style="height: 500px"></div>
        <h1>Burn</h1>
        <div id="budget" style="height: 500px"></div>

        <script>
            class Perlin {
                constructor() {
                    // Quick and dirty permutation table
                    this.perm = (() => {
                        const tmp = Array.from({ length: 256 }, () =>
                            Math.floor(Math.random() * 256),
                        );
                        return tmp.concat(tmp);
                    })();
                }

                grad(i, x) {
                    const h = i & 0xf;
                    const grad = 1 + (h & 7);

                    if ((h & 8) !== 0) {
                        return -grad * x;
                    }

                    return grad * x;
                }

                getValue(x) {
                    const i0 = Math.floor(x);
                    const i1 = i0 + 1;

                    const x0 = x - i0;
                    const x1 = x0 - 1;

                    let t0 = 1 - x0 * x0;
                    t0 *= t0;

                    let t1 = 1 - x1 * x1;
                    t1 *= t1;

                    const n0 = t0 * t0 * this.grad(this.perm[i0 & 0xff], x0);
                    const n1 = t1 * t1 * this.grad(this.perm[i1 & 0xff], x1);

                    return 0.395 * (n0 + n1); //Output is between -1 and 1.
                }
            }

            class Timeseries {
                constructor(totalSeconds, sampleRateSeconds, settings) {
                    this.xAxis = [];
                    var t = new Date();
                    t.setHours(0, 0, 0, 0);
                    var j = 0;
                    for (i = 0; i < totalSeconds; i += sampleRateSeconds) {
                        t.setSeconds(t.getSeconds() + sampleRateSeconds);
                        this.xAxis.push(t.toISOString());
                    }

                    this.settings = settings;
                    this.traceFunctions = [];
                }

                addTrace(f) {
                    this.traceFunctions.push(f);
                }

                buildData(f) {
                    var out = {
                        x: [],
                        y: [],
                    };
                    for (i = 0; i < this.xAxis.length; i++) {
                        out.x.push(this.xAxis[i]);
                        out.y.push(f(i));
                    }
                    return out;
                }

                render(divID, layout) {
                    var data = [];
                    for (const t of this.traceFunctions) {
                        var td = this.buildData(t);
                        for (const [key, value] of Object.entries(
                            this.settings,
                        )) {
                            td[key] = value;
                        }
                        data.push(td);
                    }
                    Plotly.newPlot(divID, data, layout);
                }
            }

            const slo_target_fraction = 0.999;
            var error_budget_fraction = 1 - slo_target_fraction;

            const sample_rate_s = 60;

            var timeline = [];
            var t = new Date();
            t.setHours(0, 0, 0, 0);

            var cumulativeGood = 0;
            var cumulativeBad = 0;

            const perlin = new Perlin();

            const TOTAL_SECONDS = 24 * 60 * 60;

            for (i = 0; i < TOTAL_SECONDS; i += sample_rate_s) {
                t.setSeconds(t.getSeconds() + sample_rate_s);
                const amplitude = 100000;
                const frequency = 1 / (24 * 60 * 10);
                value = amplitude * Math.sin(frequency * i) + amplitude;
                jitter = Math.random() * 10000;
                good = amplitude; //value; // + jitter;

                errorRate = perlin.getValue((256 / 4) * (i / TOTAL_SECONDS));

                // Don't allow negative errors and stop producing errors halfway through
                if (errorRate < 0 || i > TOTAL_SECONDS / 2) {
                    errorRate = 0;
                }
                // Scale maximum error percentage
                errorRate *= 0.001;

                cumulativeGood += good;
                cumulativeBad += good * errorRate;

                timeline.push({
                    time: t.toISOString(),
                    requests: good,
                    error_rate: errorRate,
                    cumulativeGood: cumulativeGood,
                    cumulativeBad: cumulativeBad,
                });
            }

            var dataGraph = new Timeseries(TOTAL_SECONDS, sample_rate_s, {
                type: "scatter",
            });
            dataGraph.addTrace((i) => timeline[i].requests);
            dataGraph.addTrace(
                (i) => timeline[i].requests * timeline[i].error_rate,
            );

            t.setSeconds(t.getSeconds() - 50000);
            t2 = new Date(t.getTime());
            t2.setSeconds(t2.getSeconds() + 5000);
            var layout = {
                showlegend: false,
                annotations: [
                    {
                        x: t.toISOString(),
                        y: 0,
                        xref: "x",
                        yref: "y",
                        text: "Something happened here",
                        showarrow: true,
                        arrowhead: 7,
                        ax: 0,
                        ay: -250,
                    },
                ],
                shapes: [
                    {
                        type: "line",
                        xref: "paper", // Uses the plot area proportions (0 to 1)
                        yref: "y", // Ties the height directly to your y-axis values
                        x0: 0, // Start at the far left edge of the chart grid
                        y0: 50000, // The y-value threshold location
                        x1: 1, // Extend to the far right edge of the chart grid
                        y1: 50000, // Same y-value to ensure the line stays horizontal
                        line: {
                            color: "rgb(255, 0, 0)",
                            width: 1,
                            dash: "dash", // Style options: 'solid', 'dot', 'dash', 'dashdot'
                        },
                    },
                    {
                        type: "rect",
                        xref: "x", // Ties the X boundaries to data coordinates
                        yref: "paper", // Sets Y boundaries to cover 100% height of the chart
                        x0: t.toISOString(), // Shaded area starts at X = 2
                        x1: t2.toISOString(), // Shaded area ends at X = 4
                        y0: 0, // Bottom edge of the chart area
                        y1: 1, // Top edge of the chart area
                        fillcolor: "#7effa9", // Background fill color
                        opacity: 0.3, // Keeps it semi-transparent so data shows through
                        line: { width: 0 }, // Removes the border around the rectangle
                    },
                ],
            };
            dataGraph.render("events", layout);

            var cumulativeGraph = new Timeseries(TOTAL_SECONDS, sample_rate_s, {
                type: "scatter",
            });
            cumulativeGraph.addTrace((i) => {
                good = timeline[i].cumulativeGood;
                bad = timeline[i].cumulativeBad;
                observedErrorRate = bad / (good + bad);
                return 1 - observedErrorRate;
            });
            cumulativeGraph.render("cumulative");

            var burnGraph = new Timeseries(TOTAL_SECONDS, sample_rate_s, {
                type: "scatter",
            });
            burnGraph.addTrace((i) => {
                good = timeline[i].cumulativeGood;
                bad = timeline[i].cumulativeBad;
                observedErrorRate = bad / (good + bad);
                return observedErrorRate / error_budget_fraction;
            });
            burnGraph.render("budget");

            var myPlot = document.getElementById("events");
            myPlot.on("plotly_click", function (cdata) {
                for (var i = 0; i < cdata.points.length; i++) {
                    t = cdata.points[i].x;
                    pi = cdata.points[i].pointIndex;
                    eventData[1]["y"][pi] = 100000;
                }
                Plotly.animate(
                    "events",
                    { data: eventData, layout: layout },
                    {
                        transition: {
                            duration: 5,
                            easing: "cubic-in-out",
                        },
                        frame: {
                            duration: 5,
                        },
                    },
                );
            });
        </script>
    </body>
</html>
